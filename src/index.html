<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Push Notification Test</title>
  </head>
  <body>
    <h1>Push Notification Test</h1>
    <button id="subscribe" style="display: none">
      Subscribe Push Notification
    </button>
    <pre id="subscribed" style="display: none">xxx</pre>
    <button id="copy" style="display: none">Copy Subscription</button>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
    <script>
      const VAPID_PUBLIC_KEY =
        "BKloSpMjjzZnwo8VYUU12mc3ThTqTVSl2djz4tXbYB0vhqxhRxV3v-4EKmfoOv9HzfxPIlfBgDWRKlVP8a9FZaM";

      (async () => {
        const registration = await navigator.serviceWorker.ready;

        const subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          displaySubscription(subscription);
          return;
        }

        const subscribeElm = document.querySelector("#subscribe");
        subscribeElm.style.display = "block";
        subscribeElm.addEventListener("click", async () => {
          const permission = await Notification.requestPermission();
          if (permission !== "granted") {
            window.alert("通知が許可されませんでした。");
          } else {
            const subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
            });
            displaySubscription(subscription);
            subscribeElm.style.display = "none";
          }
        });
      })();

      function displaySubscription(subscription) {
        const subscribedElm = document.querySelector("#subscribed");
        subscribedElm.style.display = "block";
        subscribedElm.textContent = JSON.stringify(subscription, null, 2);
        const copyBtn = document.querySelector("#copy");
        copyBtn.style.display = "block";
        copyBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(
            JSON.stringify(subscription, null, 2),
          );
        });
      }

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");
        const rawData = atob(base64);
        return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
      }
    </script>
  </body>
</html>
